name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Prepare Android files
        run: bash ci/prepare_android.sh

      - name: Fixed signing key (needed for Google Sign-In)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FB_STORAGE_BUCKET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FB_API_KEY="$FB_API_KEY" \
            --dart-define=FB_APP_ID="$FB_APP_ID" \
            --dart-define=FB_SENDER_ID="$FB_SENDER_ID" \
            --dart-define=FB_PROJECT_ID="$FB_PROJECT_ID" \
            --dart-define=FB_STORAGE_BUCKET="$FB_STORAGE_BUCKET" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          mkdir -p dist
          if [ -n "$FB_API_KEY" ]; then MODE=firebase; else MODE=demo; fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/almaqal-attendance-${MODE}.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: almaqal-attendance-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Almaqal University attendance app APK.
          files: dist/*.apk
